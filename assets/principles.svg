<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-label="How I build agents: the model proposes, code decides, a human approves anything with side effects"><title>How I build agents: the model proposes, code decides, a human approves anything with side effects</title><style>@font-face{font-family:'mono';font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}.f-mono{font-family:'mono'}@font-face{font-family:'serif';font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}.f-serif{font-family:'serif'}@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}.up{animation:up .9s cubic-bezier(.2,.7,.2,1) both}.pulse{animation:pulse 1.6s ease-in-out infinite}@keyframes travel{0%{transform:translateX(0)}100%{transform:translateX(800px)}}.dot{animation:travel 6s cubic-bezier(.45,0,.55,1) infinite}@keyframes lit{0%,100%{stroke:#2f2b26}8%,30%{stroke:#e8643c}}.node{animation:lit 6s infinite both}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="0.5" y="0.5" width="1199" height="209" rx="18" fill="#141210" stroke="#2f2b26"/><text x="44.0" y="50.0" class="f-mono" font-size="12" fill="#9a9288" text-anchor="start">HOW I BUILD AGENTS</text><line x1="200" y1="104" x2="1000" y2="104" stroke="#2f2b26" stroke-dasharray="3 5"/><circle class="node" style="animation-delay:0.00s" cx="200" cy="104" r="11" fill="#141210" stroke="#2f2b26" stroke-width="2"/><circle cx="200" cy="104" r="3" fill="#9a9288"/><text x="200.0" y="154.0" class="f-serif" font-size="30" fill="#ede6da" text-anchor="middle">The model proposes</text><text x="200.0" y="182.0" class="f-mono" font-size="11" fill="#9a9288" text-anchor="middle">LLM  ·  TOOL CALLS</text><circle class="node" style="animation-delay:2.73s" cx="600" cy="104" r="11" fill="#141210" stroke="#2f2b26" stroke-width="2"/><circle cx="600" cy="104" r="3" fill="#9a9288"/>